<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08120e">
<title>Chatbot AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <div class="crest" aria-hidden="true">AI</div>
      <div>
        <h1>Chatbot AI</h1>
        <p class="chat__model"><span class="dot"></span>NVIDIA Nemotron 3 Ultra</p>
      </div>
    </header>
    <div class="ornament" aria-hidden="true"><i></i><b></b><i></i></div>

    <section id="messages" class="chat__messages" aria-live="polite">
      <div class="msg msg--bot"><p>Halo! Ada yang bisa saya bantu?</p></div>
    </section>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <input id="user-input" type="text" placeholder="Ketik pesan..." aria-label="Pesan">
      <button id="send-btn" type="submit">Kirim</button>
    </form>
  </main>

<script src="script.js"></script>
</body>
</html>
